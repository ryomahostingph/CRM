services:

  database:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-changeme_root}
      MYSQL_DATABASE: churchcrm
      MYSQL_USER: churchcrm
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-changeme}
    volumes:
      - churchcrm-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      timeout: 20s
      retries: 10
    hostname: database

  php-fpm:
    build:
      context: ..
      dockerfile: docker/Dockerfile.churchcrm-fpm-php8
      target: prod

    image: churchcrm/crm:php8-fpm
    restart: unless-stopped

    working_dir: /var/www/html

    volumes:
      # ChurchCRM source (composer.json is here)
      - ../src:/var/www/html

      # ORM directory used by Propel
      - ../orm:/var/www/orm

    depends_on:
      database:
        condition: service_healthy

    environment:
      COMPOSER_ALLOW_SUPERUSER: 1

    hostname: php-fpm


  webserver:
    image: nginx:stable-alpine
    restart: unless-stopped

    ports:
      - "3500:80"

    volumes:
      # Same app source for nginx (read-only is correct)
      - ../src:/var/www/html:ro

      # nginx config
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - php-fpm

    hostname: webserver


volumes:
  churchcrm-db: